aid: sixfold
name: Sixfold
description: >-
  Sixfold is a New York City-headquartered AI company building purpose-built
  artificial intelligence for insurance underwriting across Property & Casualty
  and Life & Health lines. Founded by Alex Schmelkin (CEO, previously
  co-founder of Unqork), Jane Tran (COO), and Brian Moseley (CTO, previously
  Head of Developer Experience at American Express), Sixfold processes
  unstructured submissions, automates risk research, produces appetite fit
  scores, generates cited case narratives, and applies underwriting guidelines
  consistently across submissions. The platform classifies risk using industry
  standards (SIC, NAICS, ISO), supports 40+ P&C and Life & Health business
  lines, and deploys either standalone or via a flexible API into existing
  underwriting workbench, CRM, and policy administration systems. Customers
  include Zurich North America, Guardian, Generali GC&C, Skyward Specialty,
  AXIS, and Mosaic Insurance, collectively representing roughly $265B in
  gross written premium. The company raised a $30M Series B in January 2026
  and operates from offices in New York City and Lloyd's of London. Sixfold
  is the named provider behind these capabilities and is distinct from
  Cytora, a separate UK-based insurance AI provider. The platform is sold
  as enterprise SaaS to insurance carriers; there is no public self-serve
  developer portal, public API reference, SDKs, or open-source release —
  API integration is delivered under enterprise engagement.
